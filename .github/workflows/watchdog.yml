name: Colorbloop watchdog (posts what's due, retries the late ones)
on:
  schedule:
    - cron: "*/30 12-23 * * *"     # covers the 10:00 / 18:00 / 19:30 ET slots + grace
    - cron: "*/30 0-3 * * *"
  push:
    paths: ["links.json", "calendar.json"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write      # lets the loop re-dispatch itself (watchdog_loop.py)
concurrency: { group: watchdog, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests

      - name: Post everything that is due, every half hour for ~5h40m, then hand over to a fresh run
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          PLATFORMS: instagram,facebook,youtube
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "colorbloop-bot"; git config user.email "bot@users.noreply.github.com"
          python watchdog_loop.py

      - name: Re-dispatch if the loop itself failed (keeps the chain alive)
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run watchdog.yml --ref main || true
