name: Colorbloop watchdog (posts what's due, retries the late ones)
on:
  schedule:
    - cron: "*/30 12-23 * * *"     # covers the 10:00 / 18:00 / 19:30 ET slots + grace
    - cron: "*/30 0-3 * * *"
  push:
    paths: ["links.json", "calendar.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: watchdog, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests

      - name: Post everything that is due (images served by this repo's GitHub Pages)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PLATFORMS: instagram,facebook
        run: python watchdog.py

      - name: Commit the publish log
        if: always()
        run: |
          git config user.name "colorbloop-bot"; git config user.email "bot@users.noreply.github.com"
          git add publish_log.json
          git commit -m "watchdog: $(date -u +%F\ %H:%M)" || echo "nothing to commit"
          git push
